[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-security-auditor"
version = "0.1.0"
description = "Automated Django Security Audit Platform - requirements-driven SAST/DAST/dependency/network auditing against 137 Django security requirements"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "packaging>=23.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[project.scripts]
security-audit = "apps.cli:main"

[tool.setuptools]
packages = [
  "apps", "apps.api", "apps.projects", "apps.audits", "apps.requirements_engine",
  "apps.findings", "apps.reports", "apps.users",
  "scanners", "scanners.sast", "scanners.dast", "scanners.network",
  "scanners.configuration", "scanners.dependencies", "scanners.correlation",
  "security_tests", "worker",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
