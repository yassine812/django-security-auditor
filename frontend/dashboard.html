<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Django Security Auditor</title>
<style>
 :root{--bg:#0b1220;--panel:#111a2e;--panel2:#16223a;--line:#24334f;--txt:#dbe4f3;--mut:#8ea2c0;
       --red:#ef4444;--orange:#f59e0b;--green:#10b981;--blue:#3b82f6;--purple:#8b5cf6}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
 a{color:var(--blue);text-decoration:none}
 header{display:flex;align-items:center;gap:14px;padding:10px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
 header .logo{font-weight:700;letter-spacing:.4px}
 header .logo span{color:var(--green)}
 nav{display:flex;gap:4px;flex:1}
 nav a{padding:6px 12px;border-radius:7px;color:var(--mut)}
 nav a.active,nav a:hover{background:var(--panel2);color:var(--txt)}
 main{padding:22px;max-width:1300px;margin:0 auto}
 h1{font-size:19px;margin:8px 0 16px}
 h2{font-size:15px;margin:24px 0 10px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
 .grid{display:grid;gap:12px}
 .cards{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
 .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
 .card.click{cursor:pointer}
 .card.click:hover{border-color:var(--blue)}
 .card .num{font-size:28px;font-weight:750;line-height:1.1}
 .card .lbl{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
 .pctx{font-size:12px;font-weight:700}
 .sev-Critical{color:var(--red)} .sev-High{color:#fb7185} .sev-Medium{color:var(--orange)} .sev-Low{color:var(--blue)} .sev-Info{color:var(--mut)}
 .st-PASS{color:var(--green)} .st-FAIL{color:var(--red)} .st-PARTIAL{color:var(--orange)}
 .st-NOT_TESTED,.st-NOT_APPLICABLE{color:var(--mut)} .st-MANUAL_REVIEW{color:var(--purple)}
 table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
 th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}
 th{background:var(--panel2);color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
 tr:last-child td{border-bottom:none}
 .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
 .tag{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);margin-right:4px}
 .btn{background:var(--blue);border:none;color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer}
 .btn.sec{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
 input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;width:100%;font:inherit}
 label{display:block;margin:10px 0 4px;color:var(--mut);font-size:12px}
 .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
 .row>*{flex:1}
 .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
 .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
 .tabs a{padding:6px 12px;border-radius:7px;background:var(--panel2);color:var(--mut);border:1px solid var(--line)}
 .tabs a.active{color:var(--txt);border-color:var(--blue)}
 pre{background:#0a0f1c;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:320px}
 .muted{color:var(--mut)} .small{font-size:12px}
 code{background:#0a0f1c;padding:1px 6px;border-radius:5px;font-size:12px}
 .disclaimer{border:1px solid #7c2d12;background:#431407;border-radius:10px;padding:10px 14px;font-size:12.5px}
 .banner{border:1px solid #1d4ed8;background:#172554;border-radius:10px;padding:8px 14px;font-size:12.5px;margin-bottom:14px}
 #login{max-width:380px;margin:80px auto}
</style>
</head>
<body>
<header>
  <div class="logo">&#128737; Django Security <span>Auditor</span></div>
  <nav id="nav">
    <a href="#/dashboard">Tableau de bord</a>
    <a href="#/projects">Projets</a>
    <a href="#/audits">Audits</a>
    <a href="#/settings">Paramètres</a>
  </nav>
  <button class="btn sec" onclick="logout()">Se déconnecter</button>
</header>
<main id="app"></main>

<script>
/* ------------------------------------------------------------------ *
 *  Static snapshot mode: when window.DSA_SNAPSHOT is present (exported
 *  by tools/static_preview.py) the dashboard renders offline from the
 *  embedded data instead of calling the API.
 * ------------------------------------------------------------------ */
const SNAP=window.DSA_SNAPSHOT||null;
const API="";
const SEV_ORDER=["Critical","High","Medium","Low","Info"];
const SEV_FR={Critical:"Critique",High:"\u00c9lev\u00e9",Medium:"Moyen",Low:"Faible",Info:"Info"};
const SEV_MEANING={
  Critical:"Exploitable imm\u00e9diatement, impact grave &mdash; corriger en priorit\u00e9 absolue",
  High:"Faiblesse s\u00e9rieuse, exploitable &mdash; corriger avant mise en production",
  Medium:"Faiblesse r\u00e9elle, impact limit\u00e9 &mdash; corriger au prochain sprint",
  Low:"Durcissement / bonnes pratiques",
  Info:"\u00c9l\u00e9ment \u00e0 revoir, pas une violation"};
const AXES=[
  {id:"A1",label:"A1 &middot; Code (SAST)",tools:"SAST"},
  {id:"A2",label:"A2 &middot; Configuration &amp; secrets",tools:"analyseur de settings"},
  {id:"A3",label:"A3 &middot; D\u00e9pendances",tools:"analyseur de d\u00e9pendances"},
  {id:"A4",label:"A4 &middot; R\u00e9seau &amp; DAST",tools:"scanner de ports + DAST"}];
const STATUS_ORDER=["PASS","FAIL","PARTIAL","NOT_TESTED","MANUAL_REVIEW","NOT_APPLICABLE"];
const STATUS_FR={PASS:"V\u00e9rifi\u00e9",FAIL:"\u00c9chec",PARTIAL:"Partiel",
  NOT_TESTED:"Non test\u00e9",MANUAL_REVIEW:"Revue manuelle",NOT_APPLICABLE:"Non applicable"};
const ST_MEANING={PASS:"v\u00e9rifi\u00e9 avec preuves",FAIL:"violation confirm\u00e9e",
  PARTIAL:"couverture partielle",NOT_TESTED:"aucune couverture &mdash; point ouvert",
  MANUAL_REVIEW:"v\u00e9rification humaine requise",NOT_APPLICABLE:"non applicable"};
function sevFr(s){return SEV_FR[s]||s;}
function stFr(s){return STATUS_FR[s]||s;}
let TOKEN=localStorage.getItem("dsa_token")||"";
let filter={sev:"",axis:"",q:""};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function pct(n,total){return total?Math.round(100*n/total)+"%":"0%";}
function sevRank(s){const i=SEV_ORDER.indexOf(s);return i<0?9:i;}
function sortFindings(fs){return (fs||[]).slice().sort((a,b)=>sevRank(a.severity)-sevRank(b.severity)||String(a.title).localeCompare(String(b.title)));}
function axisIdx(f){
  if(f&&f.axis)return Math.max(0,Math.min(3,Number(f.axis)-1));   // fourni par l'API
  const dk=((f&&f.dedup_key)||""),src=new Set((f&&f.sources)||[]);
  if(dk.startsWith("sast:")||src.has("sast"))return 0;
  if(dk.startsWith("config:")||src.has("configuration"))return 1;
  if(dk.startsWith("dep:")||src.has("dependencies"))return 2;
  return 3;
}
function axisLabelOf(f){return AXES[axisIdx(f)].label;}
function axisLabel(f){return AXES[axisIdx(f)].label;}
function axisShort(f){return AXES[axisIdx(f)].id;}
function loc(f){
  if(f.file)return f.line?`${f.file}:${f.line}`:String(f.file);
  if(f.endpoint)return String(f.endpoint);
  const src=f.sources||[];
  if(src.includes("dependencies")&&f.proof)return "manifeste &middot; "+f.proof;
  if(src.includes("network")&&f.proof)return f.proof;
  return "\u2014";
}
function engines(f){return (f.sources||[]).map(s=>`<span class="tag">${esc(s)}</span>`).join("");}
function pill(t,cls){return `<span class="pill ${cls||""}">${esc(t)}</span>`;}
function sevPill(s){return `<span class="pill sev-${esc(s)}">${esc(sevFr(s))}</span>`;}
function stPill(s){return `<span class="pill st-${esc(s)}">${esc(stFr(s))}</span>`;}

/* ------------------------------- api ------------------------------- */
function snapshotApi(path){
  if(path==="/api/audits")return {audits:SNAP.audits||[]};
  if(path.startsWith("/api/audits/"))return SNAP.detail;
  if(path==="/api/projects")return {projects:SNAP.projects||[]};
  return {};
}
async function api(path,opts={}){
  if(SNAP)return snapshotApi(path);
  opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});
  if(TOKEN)opts.headers["Authorization"]="Bearer "+TOKEN;
  const r=await fetch(API+path,opts);
  if(r.status===401){showLogin();throw new Error("unauthorized")}
  if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
  return r.json();
}
function logout(){localStorage.removeItem("dsa_token");TOKEN="";showLogin();}
async function downloadReport(id,fmt){
  const err=document.getElementById("dlerr");
  if(SNAP){if(err)err.textContent="Static snapshot: downloads are disabled (run the local server).";return;}
  try{
    const r=await fetch(`/api/reports/${id}/${fmt}`,{headers:{Authorization:"Bearer "+TOKEN}});
    if(r.status===401){showLogin();return;}
    if(!r.ok)throw new Error((await r.json()).detail||r.statusText);
    const blob=await r.blob();
    const a=document.createElement("a");
    const names={"csv":"findings.csv","html":"report.html","json":"report.json",
                 "pdf":"report-executive.pdf","pdf-full":"report-full.pdf"};
    a.href=URL.createObjectURL(blob);
    a.download=`${id}-${names[fmt]||"report."+fmt}`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }catch(e){if(err)err.textContent="Download failed: "+e.message;}
}
function showLogin(){
  document.getElementById("app").innerHTML=`
  <div id="login" class="panel">
    <h1>Connexion</h1>
    <label>Utilisateur</label><input id="u" value="admin">
    <label>Mot de passe</label><input id="p" type="password">
    <p class="small muted">Identifiants par défaut : admin / admin-audit-2026 (à changer immédiatement en production).</p>
    <button class="btn" onclick="doLogin()">Se connecter</button>
    <p id="lerr" class="sev-Critical"></p>
  </div>`;
}
async function doLogin(){
  try{const r=await api("/api/auth/token",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});
    TOKEN=r.token;localStorage.setItem("dsa_token",TOKEN);route();}
  catch(e){document.getElementById("lerr").textContent=e.message;}
}

/* ---------------------------- shared bits --------------------------- */
function severityCards(findings,auditId){
  const total=findings.length,counts={};
  SEV_ORDER.forEach(s=>counts[s]=0);
  findings.forEach(f=>counts[f.severity]=(counts[f.severity]||0)+1);
  return SEV_ORDER.map(s=>`
    <div class="card click" onclick="goSev('${auditId}','${s}')" title="Voir les constats ${sevFr(s)}">
      <div class="num sev-${s}">${counts[s]||0}</div>
      <div class="lbl">${sevFr(s)}</div>
      <div class="pctx sev-${s}">${pct(counts[s]||0,total)} <span class="muted small">sur ${total}</span></div>
      <div class="small muted">${SEV_MEANING[s]}</div>
    </div>`).join("");
}
function axisCards(findings,reqs){
  const total=findings.length,perF=AXES.map(()=>[]),perR=AXES.map(()=>[]);
  findings.forEach(f=>perF[axisIdx(f)].push(f));
  (reqs||[]).filter(r=>!r.transverse).forEach(r=>perR[axisIdx(r)].push(r));
  return AXES.map((a,i)=>{
    const fs=perF[i],rs=perR[i],c={};
    SEV_ORDER.forEach(s=>c[s]=0);fs.forEach(f=>c[f.severity]=(c[f.severity]||0)+1);
    const mix=SEV_ORDER.filter(s=>c[s]).map(s=>`<span class="sev-${s}">${sevFr(s)} ${c[s]}</span>`).join(" &middot; ")||"<span class='muted'>aucun constat</span>";
    const st={};rs.forEach(r=>st[r.status]=(st[r.status]||0)+1);
    const res=STATUS_ORDER.filter(s=>st[s]).map(s=>`<span class="st-${s}">${stFr(s)} ${st[s]}</span>`).join(" &middot; ")||"<span class='muted'>aucune exigence</span>";
    return `<div class="card">
      <div class="num">${fs.length}</div>
      <div class="lbl">${a.label}</div>
      <div class="pctx">${pct(fs.length,total)} <span class="muted small">des constats</span></div>
      <div class="small muted">${a.tools}</div>
      <div class="small">${mix}</div>
      <div class="small" style="margin-top:6px;border-top:1px solid var(--line);padding-top:6px">
        <b>${rs.length} exigences</b><div>${res}</div></div>
    </div>`;}).join("");
}
function axisResultsTable(findings,reqs){
  const total=findings.length,perF=AXES.map(()=>[]),perR=AXES.map(()=>[]);
  const transverse=(reqs||[]).filter(r=>r.transverse);
  findings.forEach(f=>perF[axisIdx(f)].push(f));
  (reqs||[]).filter(r=>!r.transverse).forEach(r=>perR[axisIdx(r)].push(r));
  return `<table><tr><th style="width:250px">Axe</th><th style="width:110px">Constats</th>
    <th style="width:110px">Exigences</th><th>R\u00e9sultats des exigences</th><th style="width:230px">Outils</th></tr>
    ${AXES.map((a,i)=>{
      const rs=perR[i],st={};const c={};perF[i].forEach(f=>c[f.severity]=(c[f.severity]||0)+1);
      rs.forEach(r=>st[r.status]=(st[r.status]||0)+1);
      const res=STATUS_ORDER.filter(s=>st[s]).map(s=>`<span class="st-${s}">${stFr(s)} ${st[s]}</span>`).join(" &middot; ")||"<span class='muted'>aucune</span>";
      const mix=SEV_ORDER.filter(s=>c[s]).map(s=>`<span class="sev-${s}">${sevFr(s)} ${c[s]}</span>`).join(", ")||"<span class='muted'>aucun constat</span>";
      return `<tr><td><b>${a.label}</b><div class="small muted">${mix}</div></td>
        <td>${perF[i].length}<div class="small muted">${pct(perF[i].length,total)}</div></td>
        <td>${rs.length}</td><td class="small">${res}</td><td class="small muted">${a.tools}</td></tr>`;
    }).join("")}
    ${transverse.length?(()=>{const st={};transverse.forEach(r=>st[r.status]=(st[r.status]||0)+1);
      const res=STATUS_ORDER.filter(s=>st[s]).map(s=>`<span class="st-${s}">${stFr(s)} ${st[s]}</span>`).join(" &middot; ");
      return `<tr><td><b>Exigences transverses</b><div class="small muted">aucun scanner dédié : processus, gouvernance, revue manuelle</div></td>
        <td>&ndash;</td><td>${transverse.length}</td><td class="small">${res}</td>
        <td class="small muted">revue manuelle</td></tr>`;})():""}
  </table>`;
}
function requirementCards(rr){
  const counts={};rr.forEach(r=>counts[r.status]=(counts[r.status]||0)+1);
  return STATUS_ORDER.map(s=>`
    <div class="card">
      <div class="num st-${s}">${counts[s]||0}</div>
      <div class="lbl">${stFr(s)}</div>
      <div class="pctx">${pct(counts[s]||0,rr.length)} <span class="muted small">de ${rr.length}</span></div>
      <div class="small muted">${ST_MEANING[s]} <span class="tag">${s}</span></div>
    </div>`).join("");
}
function axisDetail(fs,reqs){
  return AXES.map((a,i)=>{
    const mine=fs.filter(f=>axisIdx(f)===i);
    const mreq=(reqs||[]).filter(r=>!r.transverse&&axisIdx(r)===i);
    const trans=(reqs||[]).filter(r=>r.transverse);
    return `<h2>${a.label} <span class="muted small">(${a.tools})</span></h2>
    <p class="small muted">${mine.length} constat(s) &middot; ${mreq.length} exigence(s) rattach\u00e9e(s) au catalogue</p>
    <table><tr><th style="width:110px">S\u00e9v\u00e9rit\u00e9</th><th style="width:250px">Emplacement</th>
      <th>Constat / correction</th><th style="width:120px">Moteurs</th></tr>
      ${mine.map(f=>`<tr><td>${sevPill(f.severity)}</td>
        <td class="small"><code>${esc(loc(f))}</code></td>
        <td>${esc(f.title)}<div class="small muted">${esc((f.remediation||"").slice(0,160))}</div></td>
        <td class="small">${engines(f)}</td></tr>`).join("")
        ||"<tr><td colspan=4 class='muted'>Aucun constat sur cet axe</td></tr>"}</table>
    <p class="small muted">Exigences de cet axe :
      ${STATUS_ORDER.filter(s=>mreq.some(r=>r.status===s)).map(s=>{
        const ids=mreq.filter(r=>r.status===s).map(r=>r.requirement_id);
        return `<span class="tag st-${s}">${stFr(s)} ${ids.length}</span>`;
      }).join(" ")||"aucune"}
      ${mreq.filter(r=>r.status==="FAIL").length?
        `<div class="small" style="margin-top:4px">En \u00e9chec : <code>${esc(mreq.filter(r=>r.status==="FAIL").map(r=>r.requirement_id).join(", "))}</code></div>`:""}
    </p>`;
  }).join("") + (()=>{const trans=(reqs||[]).filter(r=>r.transverse);
    if(!trans.length)return "";
    return `<h2>Exigences transverses <span class="muted small">(aucun scanner d\u00e9di\u00e9 : processus, gouvernance, revue manuelle)</span></h2>
    <p class="small muted">${trans.length} exigence(s)</p>
    <table><tr><th style="width:140px">Statut</th><th>Exigences</th></tr>
    ${STATUS_ORDER.filter(s=>trans.some(r=>r.status===s)).map(s=>{
      const ids=trans.filter(r=>r.status===s).map(r=>r.requirement_id);
      return `<tr><td>${stPill(s)}</td><td class="small"><code>${esc(ids.join(", "))}</code></td></tr>`;}).join("")}
    </table>`;})();
}
function priorityTable(findings){
  const prio=sortFindings(findings).filter(f=>f.severity==="Critical"||f.severity==="High");
  if(!prio.length)return "<div class='panel muted'>Aucun constat Critique ou \u00c9lev\u00e9 dans cet audit.</div>";
  const shown=prio.slice(0,15);
  return `<table><tr><th style="width:100px">S\u00e9v\u00e9rit\u00e9</th><th style="width:60px">Axe</th>
    <th style="width:250px">Emplacement</th><th>Constat / correction</th></tr>
    ${shown.map(f=>`<tr>
      <td>${sevPill(f.severity)}</td>
      <td class="small" title="${esc(AXES[axisIdx(f)].tools)}">${axisShort(f)}</td>
      <td class="small"><code>${esc(loc(f))}</code></td>
      <td>${esc(f.title)}<div class="small muted">${esc((f.remediation||f.description||"").slice(0,200))}</div></td>
    </tr>`).join("")}</table>
    ${prio.length>shown.length?`<p class="small muted">+ ${prio.length-shown.length} autres constats Critique/\u00c9lev\u00e9 &mdash; voir l'onglet <b>constats</b> ou le rapport.</p>`:""}`;
}
function hotspotTable(findings){
  const groups={};
  findings.forEach(f=>{
    const key=f.file?String(f.file):(f.endpoint?String(f.endpoint)
      :(axisIdx(f)===2?"(manifests de d\u00e9pendances)":"(sans emplacement)"));
    (groups[key]=groups[key]||[]).push(f);
  });
  const rows=Object.entries(groups).sort((a,b)=>b[1].length-a[1].length).slice(0,10);
  if(!rows.length)return "<div class='panel muted'>Aucun emplacement enregistr\u00e9.</div>";
  return `<table><tr><th>Fichier / endpoint</th><th style="width:110px">Constats</th><th style="width:340px">Mix s\u00e9v\u00e9rit\u00e9s</th></tr>
    ${rows.map(([where,fs])=>{
      const c={};fs.forEach(f=>c[f.severity]=(c[f.severity]||0)+1);
      const mix=SEV_ORDER.filter(s=>c[s]).map(s=>`<span class="sev-${s}">${sevFr(s)} ${c[s]}</span>`).join(" &middot; ");
      return `<tr><td><code>${esc(where)}</code></td><td>${fs.length}</td><td class="small">${mix}</td></tr>`;
    }).join("")}</table>`;
}

/* ------------------------------ pages ------------------------------ */
async function pageDashboard(){
  const a=await api("/api/audits");
  const latest=(a.audits||[])[0];
  let detail=null; if(latest){try{detail=await api("/api/audits/"+latest.id);}catch(e){}}
  const el=document.getElementById("app");
  if(!detail){el.innerHTML="<h1>Dashboard</h1><div class='panel muted'>No audits yet. Create one from <a href='#/audits'>Audits</a>.</div>";return;}
  el.innerHTML=auditOverview(detail,true);
  if(detail.status!=="COMPLETE")setTimeout(route,4000);
}
function auditOverview(d,showHeader){
  const fs=d.findings||[],sc=d.score||{},rr=d.requirement_results||[];
  const crit=fs.filter(f=>f.severity==="Critical"||f.severity==="High").length;
  return `${showHeader?`<h1>Tableau de bord &mdash; ${esc(d.id)} ${d.status!=="COMPLETE"?pill(d.status):""}</h1>`:""}
  ${(d.project&&d.project.name)?`<p class="small muted">Projet <b>${esc(d.project.name)}</b> &middot; ${esc(d.project.source_type||"")} ${d.project.commit_sha?`&middot; commit <code>${esc(d.project.commit_sha.slice(0,12))}</code>`:""}</p>`:""}
  ${d.status!=="COMPLETE"?'<div class="panel">Le pipeline tourne encore &mdash; cette page se rafraîchit automatiquement.</div>':""}
  <div class="grid cards">
    <div class="card"><div class="num">${sc.score!=null?sc.score:"&ndash;"}</div><div class="lbl">Score de sécurité /100</div>
      <div class="small muted">Indicateur seulement : les constats et les statuts d'exigences font foi.</div></div>
    <div class="card"><div class="num">${fs.length}</div><div class="lbl">Constats</div>
      <div class="small muted">${crit} Critique+\u00c9lev\u00e9 &middot; ${fs.filter(f=>f.file).length} avec un fichier précis</div></div>
    <div class="card"><div class="num">${rr.length}</div><div class="lbl">Exigences évaluées</div>
      <div class="small muted">sur le catalogue des 137 exigences</div></div>
    <div class="card"><div class="num">${(d.jobs||[]).filter(j=>j.status==="SUCCESS").length}/${(d.jobs||[]).length}</div><div class="lbl">Tâches du pipeline OK</div>
      <div class="small muted">${(d.jobs||[]).filter(j=>j.status==="FAILED").length} en échec / ignorées</div></div>
  </div>
  <h2>Constats par sévérité (part du total &mdash; cliquez pour filtrer)</h2>
  <div class="grid cards">${severityCards(fs,d.id)}</div>
  <h2>Résultats par axe (4 axes) &mdash; constats et exigences</h2>
  <div class="grid cards">${axisCards(fs,rr)}</div>
  ${axisResultsTable(fs,rr)}
  <h2>Actions prioritaires &mdash; Critique &amp; \u00c9lev\u00e9 avec emplacement</h2>
  ${priorityTable(fs)}
  <h2>Emplacements les plus touchés</h2>
  ${hotspotTable(fs)}
  <h2>Exigences (${rr.length})</h2>
  <div class="grid cards">${requirementCards(rr)}</div>
  <h2>Tâches du pipeline</h2><table><tr><th>Tâche</th><th style="width:120px">Statut</th><th>Erreur</th></tr>
  ${(d.jobs||[]).map(j=>`<tr><td>${esc(j.name)}</td><td>${pill(j.status)}</td><td class="small muted">${esc(j.error||"")}</td></tr>`).join("")}</table>
  <h2>Journal structuré</h2><pre>${(d.logs||[]).map(l=>`[${esc((l.ts||"").slice(11,19))}] ${esc(l.level)} ${esc(l.message)}`).join("\n")}</pre>
  <div class="disclaimer" style="margin-top:18px">Le score est un indicateur de synthèse. Les exigences NON TESTÉES et en REVUE MANUELLE restent ouvertes : l'absence de constat ne prouve pas la sécurité.</div>`;
}
function goSev(id,sev){
  if(!id)return;
  filter.sev=sev;
  const target=`#/audits/${id}/findings/${sev}`;
  if(location.hash===target)route(); else location.hash=target;
}
async function pageProjects(){
  const d=await api("/api/projects");
  document.getElementById("app").innerHTML=`<h1>Projets</h1>
  <table><tr><th>Nom</th><th>Type</th><th>Chemin / d\u00e9p\u00f4t</th><th>Commit</th></tr>
  ${(d.projects||[]).map(p=>`<tr><td>${esc(p.name||"")}</td><td>${esc(p.source_type||"")}</td><td class="small">${esc(p.repo_url||p.path||"")}</td><td class="small">${esc((p.commit_sha||"").slice(0,12))}</td></tr>`).join("")||"<tr><td colspan=4 class='muted'>No projects yet.</td></tr>"}</table>`;
}
async function pageAudits(){
  const d=await api("/api/audits");
  document.getElementById("app").innerHTML=`<h1>Audits</h1>
  <div class="panel">
    <h2 style="margin-top:0">Cr\u00e9er un audit</h2>
    <div class="row">
      <div><label>Nom du projet</label><input id="np" placeholder="mon-projet-django"></div>
      <div><label>Type de source</label><select id="st"><option value="local">Dossier local</option><option value="github">GitHub</option></select></div>
      <div><label>Chemin local / URL GitHub</label><input id="pth" placeholder="./projet ou https://github.com/org/repo"></div>
    </div>
    <label><input type="checkbox" id="authz" style="width:auto"> Je confirme \u00eatre autoris\u00e9 \u00e0 tester la s\u00e9curit\u00e9 de cette application et de son infrastructure.</label>
    <button class="btn" onclick="createAudit()">D\u00e9marrer l'audit</button> <span id="cerr" class="sev-Critical"></span>
  </div>
  <table><tr><th>ID</th><th>Projet</th><th>Cr\u00e9\u00e9 le</th><th>Statut</th><th></th></tr>
  ${(d.audits||[]).map(a=>`<tr><td><a href="#/audits/${esc(a.id)}">${esc(a.id)}</a></td><td>${esc(a.project||"")}</td><td class="small">${esc(a.created_at||"")}</td><td>${pill(a.status||"")}</td><td><a href="#/audits/${esc(a.id)}">ouvrir</a></td></tr>`).join("")}</table>`;
}
async function createAudit(){
  const stype=st.value,isGh=stype==="github";
  const project=isGh?{name:np.value||"github-project",source_type:"github",repo_url:pth.value}
                    :{name:np.value||"local-project",source_type:"local",path:pth.value};
  try{const r=await api("/api/audits",{method:"POST",body:JSON.stringify({project,authorization_confirmed:authz.checked})});
    location.hash="#/audits/"+r.audit_id;}
  catch(e){document.getElementById("cerr").textContent=e.message;}
}
function setFilter(k,v){filter[k]=v;renderFindingRows(window.__audit);}
function filterFindings(d){
  return sortFindings(d.findings||[]).filter(f=>{
    if(filter.sev&&f.severity!==filter.sev)return false;
    if(filter.axis&&axisShort(f)!==filter.axis)return false;
    if(filter.q){
      const hay=[f.title,f.description,f.file,f.endpoint,f.proof,(f.cwe||[]).join(" "),(f.requirement_ids||[]).join(" ")].join(" ").toLowerCase();
      if(!hay.includes(filter.q.toLowerCase()))return false;
    }
    return true;});
}
function findingRows(d){
  const fs=filterFindings(d);
  if(!fs.length)return "<tr><td colspan=7 class='muted'>Aucun constat ne correspond \u00e0 ces filtres.</td></tr>";
  return fs.map(f=>`<tr>
    <td>${sevPill(f.severity)}<div class="small muted">${esc(f.confidence||"")}</div></td>
    <td class="small" title="${esc(AXES[axisIdx(f)].tools)}">${axisShort(f)}
      <div class="small muted">${esc(axisLabelOf(f).replace(/&middot;/g,"\u00b7"))}</div></td>
    <td class="small"><code title="${esc(loc(f))}">${esc(loc(f))}</code></td>
    <td>${esc(f.title)}<div class="small muted">${esc((f.description||"").slice(0,180))}</div>
        <div class="small muted">correction : ${esc((f.remediation||"").slice(0,160))}</div></td>
    <td class="small">${engines(f)}</td>
    <td class="small">${esc((f.requirement_ids||[]).join(", "))}</td>
    <td class="small">${esc((f.cwe||[]).join(", "))}${f.owasp?`<div class="muted">${esc(f.owasp)}</div>`:""}</td>
  </tr>`).join("");
}
function renderFindingRows(d){
  const el=document.getElementById("frows"); if(!el)return;
  el.innerHTML=findingRows(d);
  const c=document.getElementById("fcount");
  if(c)c.textContent=`${filterFindings(d).length} of ${(d.findings||[]).length} findings shown`;
}
function findingsToolbar(){
  return `<div class="panel"><div class="row">
    <div style="flex:0 0 180px"><label>S\u00e9v\u00e9rit\u00e9</label>
      <select onchange="setFilter('sev',this.value)">
        <option value="">Toutes les s\u00e9v\u00e9rit\u00e9s</option>
        ${SEV_ORDER.map(s=>`<option value="${s}" ${filter.sev===s?"selected":""}>${sevFr(s)}</option>`).join("")}
      </select></div>
    <div style="flex:0 0 230px"><label>Axe</label>
      <select onchange="setFilter('axis',this.value)">
        <option value="">Tous les axes</option>
        ${AXES.map(a=>`<option value="${a.id}" ${filter.axis===a.id?"selected":""}>${a.id} &middot; ${a.tools}</option>`).join("")}
      </select></div>
    <div><label>Recherche (titre, fichier, endpoint, CWE, exigence)</label>
      <input id="fq" placeholder="ex. settings.py, CWE-89, REQ-004" value="${esc(filter.q)}"
             oninput="setFilter('q',this.value)"></div>
    <div style="flex:0 0 210px"><label>&nbsp;</label><span id="fcount" class="small muted"></span></div>
  </div></div>`;
}
async function pageAudit(id,tab,sev){
  const d=await api("/api/audits/"+id);
  window.__audit=d;
  tab=tab||"overview";
  if(sev!==undefined)filter.sev=sev||"";
  const tabs=["overview","axes","requirements","findings","endpoints","jobs","logs","report"];
  const TAB_FR={overview:"synth\u00e8se",axes:"4 axes",requirements:"exigences",findings:"constats",
                endpoints:"endpoints",jobs:"t\u00e2ches",logs:"journal",report:"rapport"};
  let body="";
  if(tab==="overview"){
    body=auditOverview(d,false);
  }else if(tab==="axes"){
    body=`<div class="grid cards">${axisCards(d.findings||[],d.requirement_results||[])}</div>
    ${axisResultsTable(d.findings||[],d.requirement_results||[])}
    ${axisDetail(d.findings||[],d.requirement_results||[])}`;
  }else if(tab==="requirements"){
    body=`<table><tr><th>Exigence</th><th style="width:110px">Axe</th><th style="width:130px">Statut</th><th style="width:120px">Sources</th><th style="width:90px">Constats</th><th>Preuves / notes</th></tr>
    ${(d.requirement_results||[]).map(r=>`<tr><td><b>${esc(r.requirement_id)}</b></td><td class="small" title="${esc(AXES[axisIdx(r)].tools)}">${axisShort(r)}</td><td>${stPill(r.status)}<div class="small muted">${esc(r.status)}</div></td><td class="small">${esc((r.sources||[]).join(", "))}</td><td class="small">${(r.finding_ids||[]).length}</td><td class="small muted">${esc((r.notes||[]).join(" | ").slice(0,220))}</td></tr>`).join("")}</table>`;
  }else if(tab==="findings"){
    body=findingsToolbar()
      +`<table><tr><th style="width:110px">S\u00e9v\u00e9rit\u00e9</th><th style="width:120px">Axe</th>
        <th style="width:230px">Emplacement (fichier:ligne / endpoint)</th><th>Constat / correction</th>
        <th style="width:130px">Moteurs</th><th style="width:110px">Exigences</th><th style="width:110px">CWE / OWASP</th></tr>
        <tbody id="frows">${findingRows(d)}</tbody></table>`;
    setTimeout(()=>renderFindingRows(d),0);
  }else if(tab==="endpoints"){
    body=`<table><tr><th>M\u00e9thode</th><th>Chemin</th><th>Vue</th><th>Note</th></tr>
    ${(d.endpoints||[]).map(e=>`<tr><td>${esc(e.method)}</td><td><code>${esc(e.path)}</code></td><td class="small">${esc(e.view||"")}</td><td class="small muted">${esc(e.note||"")}</td></tr>`).join("")||"<tr><td colspan=4 class='muted'>No endpoints discovered</td></tr>"}</table>`;
  }else if(tab==="jobs"){
    body=`<table><tr><th>T\u00e2che</th><th>Statut</th><th>D\u00e9but</th><th>Fin</th><th>Erreur</th></tr>
    ${(d.jobs||[]).map(j=>`<tr><td>${esc(j.name)}</td><td>${pill(j.status)}</td><td class="small">${esc(j.started_at||"")}</td><td class="small">${esc(j.finished_at||"")}</td><td class="small muted">${esc(j.error||"")}</td></tr>`).join("")}</table>`;
  }else if(tab==="logs"){
    body=`<pre>${(d.logs||[]).map(l=>`[${esc((l.ts||"").slice(11,19))}] ${esc(l.level)} ${esc(l.message)}`).join("\n")}</pre>`;
  }else if(tab==="report"){
    body=`<div class="panel">
      <button class="btn" onclick="downloadReport('${id}','pdf')">PDF &mdash; synth\u00e8se (court)</button>
      <button class="btn sec" onclick="downloadReport('${id}','pdf-full')">PDF &mdash; d\u00e9tail complet</button>
      <button class="btn sec" onclick="downloadReport('${id}','html')">HTML (d\u00e9tail)</button>
      <button class="btn sec" onclick="downloadReport('${id}','json')">JSON</button>
      <button class="btn sec" onclick="downloadReport('${id}','csv')">CSV (constats)</button>
      <p id="dlerr" class="sev-Critical"></p>
      <p class="small muted"><b>PDF synth\u00e8se</b> : r\u00e9sum\u00e9, parts par s\u00e9v\u00e9rit\u00e9 et par axe,
      actions prioritaires avec emplacement, fichiers les plus touch\u00e9s, couverture et limites (court).
      <b>PDF complet</b> : chaque constat avec preuve, correction exacte du code, correspondances CWE/OWASP.
      HTML/CSV/JSON : tout, pour filtrer et archiver (CSV/JSON en anglais, cl\u00e9s stables).</p></div>`;
  }
  document.getElementById("app").innerHTML=`
  <h1>Audit ${esc(id)} ${pill(d.status)}</h1>
  <p class="small muted">Projet : <b>${esc((d.project||{}).name)}</b> &mdash; ${esc((d.project||{}).source_type)}
  ${(d.project||{}).commit_sha?` &mdash; commit <code>${esc(d.project.commit_sha.slice(0,12))}</code>`:""}</p>
  <div class="tabs">${tabs.map(t=>`<a class="${t===tab?"active":""}" href="#/audits/${id}/${t}">${TAB_FR[t]||t}</a>`).join("")}</div>
  ${body}
  ${d.status!=="COMPLETE"?'<p class="muted small">Audit en cours &mdash; rafra\u00eechissement automatique&hellip;</p>':""}`;
  if(d.status!=="COMPLETE")setTimeout(route,4000);
}
function pageSettings(){
  document.getElementById("app").innerHTML=`<h1>Param\u00e8tres</h1>
  <div class="panel">
    <p class="small muted">La configuration est lue depuis <code>security-audit.yml</code> \u00e0 la racine de la plateforme.
    Seules les cibles list\u00e9es dans <code>network.authorized_targets</code> (par d\u00e9faut 127.0.0.1 / localhost) peuvent \u00eatre scann\u00e9es.
    Les \u00e9tapes r\u00e9seau et DAST exigent en plus la confirmation d'autorisation.</p>
    <label>Jeton d'API</label><input value="${esc(TOKEN)}">
  </div>`;
}
/* ------------------------------ router ------------------------------ */
async function route(){
  const h=location.hash||"#/dashboard";
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("active",a.getAttribute("href")===h.split("/").slice(0,2).join("/")));
  if(!TOKEN&&!SNAP){showLogin();return;}
  try{
    if(h.startsWith("#/projects"))await pageProjects();
    else if(h.startsWith("#/audits/")){const p=h.split("/");await pageAudit(p[2],p[3],p[4]&&decodeURIComponent(p[4]));}
    else if(h.startsWith("#/audits"))await pageAudits();
    else if(h.startsWith("#/settings"))pageSettings();
    else await pageDashboard();
  }catch(e){document.getElementById("app").innerHTML=`<div class="panel sev-Critical">${esc(e.message)}</div>`;}
}
window.addEventListener("hashchange",route);
if(SNAP){document.querySelector("header").insertAdjacentHTML("afterend",
  `<div class="banner" style="margin:14px 20px 0">Export statique &mdash; lecture seule, sans API. Les boutons qui nécessitent le serveur sont désactivés.</div>`);
  document.querySelector("header button").style.display="none";}
route();
</script>
</body>
</html>
